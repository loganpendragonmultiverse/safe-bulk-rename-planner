name: Exact-tag Rename native Windows acceptance
on:
  push:
    branches: [qa/rename-native-windows-v1.1.3-20261021]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: qa-routing
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 62021671dd2e41b58707653af44fc3ec2578a5a9
          path: tag-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact frozen transport inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'qa-routing/.github/qa/rename-native-v1.1.3'
          if ((Get-FileHash (Join-Path $base 'bootstrap.py') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '58bd02b14129eda2fa10c34066aee98e941d82218bc6238d1a5aeb13853cceac') { throw 'Bootstrap hash mismatch' }
          if ((Get-FileHash (Join-Path $base 'run_rename_native.py.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9b4957966121c53f7b4ea86c60b47225655db995a38eb8e26a7982992ab38ddf') { throw 'Runner hash mismatch' }
          if ((Get-FileHash (Join-Path $base 'routing.json') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cdae2d5412274e453681353b15995c31569bba57c4324a6682322834bab59ac0') { throw 'Routing hash mismatch' }
      - name: Download exact existing official tag artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B qa-routing/.github/qa/rename-native-v1.1.3/bootstrap.py download
      - name: Execute genuine native preflight and unchanged installed acceptance
        shell: pwsh
        run: python -I -B qa-routing/.github/qa/rename-native-v1.1.3/bootstrap.py run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: rename-native-windows-${{ matrix.python }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rename-native-*/DOWNLOAD.json
            ${{ runner.temp }}/rename-native-*/PREFLIGHT.json
            ${{ runner.temp }}/rename-native-*/MATERIALIZATION.json
            ${{ runner.temp }}/rename-native-*/acceptance/RESULT.json
            ${{ runner.temp }}/rename-native-*/acceptance/artifact-*/*.xml
            ${{ runner.temp }}/rename-native-*/acceptance/artifact-*/*.log
