[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safe-bulk-rename-planner"
version = "1.1.2"
description = "Preview collision-safe filename changes and produce a reversible rename manifest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
keywords = ["rename", "files", "preview", "undo", "safety"]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[project.scripts]
rename-plan = "rename_planner.cli:main"

[project.urls]
Homepage = "https://github.com/loganpendragonmultiverse/safe-bulk-rename-planner"
Issues = "https://github.com/loganpendragonmultiverse/safe-bulk-rename-planner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rename_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel.shared-data]
"README.md" = "share/doc/safe-bulk-rename-planner/README.md"
"CHANGELOG.md" = "share/doc/safe-bulk-rename-planner/CHANGELOG.md"
"DEVELOPMENT.md" = "share/doc/safe-bulk-rename-planner/DEVELOPMENT.md"
"TESTING.md" = "share/doc/safe-bulk-rename-planner/TESTING.md"

"LICENSE" = "share/doc/safe-bulk-rename-planner/LICENSE"
"examples/README.md" = "share/doc/safe-bulk-rename-planner/examples/README.md"

[tool.mypy]
python_version = "3.10"
strict = true
